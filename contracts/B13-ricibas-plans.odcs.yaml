# ODCS v3 datu līgums: B13 Valdības rīcības plāni
# Ģenerēts no schemas/valdibas-deklaracijas-ricibas-plans-0.2.xsd (tools/xsd_to_odcs.py, lakehouse). Shēmas daļu nelabot ar roku — labot XSD un ģenerēt no jauna.
apiVersion: v3.0.2
kind: DataContract
id: urn:pppa:cac:contract:B13
name: Valdības rīcības plāni
version: 0.2.0
status: active
domain: Valsts kā kods (Country as Code)
dataProduct: Valdības deklarācijas datukopa
tenant: PPP Asociācija (PPPA)
description:
  purpose: Rīcības plāna pasākumi ar saiti uz deklarācijas uzdevumu (task = lv-dekl-….uNNN), atbildīgajām institūcijām (CaC ID), termiņiem un
    finansējumu.
  usage: Mašīnlasāma datu apmaiņa; ielāde datu ezerā katru dienu.
  limitations: Izpildes gaitas dati (Progress) plānā vēl netiek publicēti.
servers:
- server: processgit
  type: custom
  format: xml
  description: ProcessGit repozitorijs (Gitea API v1)
  customProperties:
  - property: url
    value: https://processgit.org/Country-as-Code/Valdibas-Deklaracija-as-Code
  - property: ref
    value: main
  - property: path
    value: data/lv-mk-*.rp.xml
  - property: schema
    value: https://processgit.org/Country-as-Code/Valdibas-Deklaracija-as-Code/src/branch/main/schemas/valdibas-deklaracijas-ricibas-plans-0.2.xsd
schema:
- name: GovernmentActionPlan
  logicalType: object
  physicalType: xml-element
  physicalName: GovernmentActionPlan
  description: ''
  properties:
  - name: id
    logicalType: string
    required: true
    logicalTypeOptions:
      pattern: lv-(dekl|mk)-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[2-9])?(\.[a-z]{1,2}[0-9]*(-[0-9]+)*)+
    description: Valdības ID + .rp, piemēram lv-mk-2026-05-28.rp.
    primaryKey: true
    unique: true
  - name: government
    logicalType: string
    required: true
    logicalTypeOptions:
      pattern: lv-mk-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[2-9])?
  - name: declaration
    logicalType: string
    required: true
    logicalTypeOptions:
      pattern: lv-dekl-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[2-9])?
  - name: schemaVersion
    logicalType: string
    required: true
  customProperties:
  - property: lakehouseTable
    value: cac_bronze.pg_plan
- name: Approval
  logicalType: object
  physicalType: xml-element
  physicalName: Approval
  description: Ministru kabineta rīkojums, ar kuru plāns apstiprināts vai grozīts. Katrs rīkojums ir plāna versija (.vN).
  properties:
  - name: id
    logicalType: string
    required: true
    logicalTypeOptions:
      pattern: lv-(dekl|mk)-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[2-9])?(\.[a-z]{1,2}[0-9]*(-[0-9]+)*)+
    description: 'Jebkura elementa globāli unikāls identifikators: saknes identifikators + segmenti, piemēram lv-dekl-2026-05-28.u012 vai lv-mk-2026-05-28.rp.u001.p3.'
    primaryKey: true
    unique: true
  - name: kind
    logicalType: string
    required: true
    quality:
    - type: library
      rule: validValues
      validValues:
      - approval
      - amendment
  - name: Act
    logicalType: string
    required: true
    logicalTypeOptions:
      pattern: '[\s\S]*\S[\s\S]*'
  - name: Date
    logicalType: date
    required: true
  - name: Protocol
    logicalType: string
    required: false
    logicalTypeOptions:
      pattern: '[\s\S]*\S[\s\S]*'
  - name: Publication
    logicalType: string
    required: false
    logicalTypeOptions:
      pattern: '[\s\S]*\S[\s\S]*'
  - name: URL
    logicalType: array
    required: false
    items:
      logicalType: string
  customProperties:
  - property: lakehouseTable
    value: cac_bronze.pg_plan
- name: Measure
  logicalType: object
  physicalType: xml-element
  physicalName: Measure
  description: Rīcības plāna pasākums — viena plāna tabulas rinda. id = plāna ID + .uNNN.pN, kur NNN ir uzdevuma numurs un N — pasākuma numurs
    uzdevumā.
  properties:
  - name: id
    logicalType: string
    required: true
    logicalTypeOptions:
      pattern: lv-(dekl|mk)-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[2-9])?(\.[a-z]{1,2}[0-9]*(-[0-9]+)*)+
    description: 'Jebkura elementa globāli unikāls identifikators: saknes identifikators + segmenti, piemēram lv-dekl-2026-05-28.u012 vai lv-mk-2026-05-28.rp.u001.p3.'
    primaryKey: true
    unique: true
  - name: number
    logicalType: string
    required: true
    logicalTypeOptions:
      pattern: '[0-9]{1,3}\.[0-9]{1,2}\.?'
    description: Aile „Pasākuma numurs”, kā drukāts, piemēram 1.3.
  - name: task
    logicalType: string
    required: true
    logicalTypeOptions:
      pattern: lv-dekl-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[2-9])?\.u[0-9]{3,4}(-[0-9]+)?
    description: Deklarācijas uzdevums. Aizstāj plāna tabulas ailes „Deklarācijas sadaļa un rīcības joma”, „Deklarācijā dotā uzdevuma numurs”
      un „Deklarācijā dotais uzdevums”.
  - name: funding
    logicalType: string
    required: true
    description: allocated = rīkojuma 1. pielikums (finansējums rasts vai nodrošināti kompensējošie pasākumi); additional = 2. pielikums (nepieciešams
      papildu finansējums).
    quality:
    - type: library
      rule: validValues
      validValues:
      - allocated
      - additional
  - name: priority
    logicalType: string
    required: false
    description: Aile „Prioritārie pasākumi”, burtiski, piemēram PP(AizM). Nav norādīts, ja pasākums nav prioritārs.
  - name: Text
    logicalType: string
    required: true
    logicalTypeOptions:
      pattern: '[\s\S]*\S[\s\S]*'
    description: Aile „Rīcības plāna pasākums”, burtiski.
  - name: Result
    logicalType: string
    required: true
    logicalTypeOptions:
      pattern: '[\s\S]*\S[\s\S]*'
    description: Aile „Darbības rezultāts”, burtiski.
  - name: Responsible
    logicalType: string
    required: true
    logicalTypeOptions:
      pattern: '[\s\S]*\S[\s\S]*'
    description: Aile „Atbildīgā institūcija”, burtiski.
  - name: Responsible@orgs
    logicalType: array
    required: false
  - name: CoResponsible
    logicalType: string
    required: false
    logicalTypeOptions:
      pattern: '[\s\S]*\S[\s\S]*'
    description: Aile „Līdzatbildīgās institūcijas”, burtiski.
  - name: CoResponsible@orgs
    logicalType: array
    required: false
  - name: Deadline
    logicalType: string
    required: true
    logicalTypeOptions:
      pattern: '[\s\S]*\S[\s\S]*'
    description: Aile „Izpildes termiņš”, burtiski.
  - name: Deadline@values
    logicalType: array
    required: false
  customProperties:
  - property: lakehouseTable
    value: cac_bronze.pg_plan_measure
  - property: lakehouseTable
    value: cac_silver.plan_measure
  - property: lakehouseTable
    value: cac_silver.measure_organization
quality:
- name: xsd_valid
  type: custom
  engine: xsd
  implementation: schemas/valdibas-deklaracijas-ricibas-plans-0.2.xsd
  description: Datne atbilst XSD shēmai; neatbilstoša datne tiek reģistrēta kā kļūda
  dimension: conformity
- name: filename_is_id
  type: custom
  engine: cac-lakehouse
  implementation: Path(path).stem == root/@id
  description: Datnes nosaukums = dokumenta identifikators
  dimension: consistency
- name: measure_has_responsible_org
  type: custom
  engine: cac-lakehouse
  implementation: app.cac_processgit:measure_has_responsible_org
  description: Pasākumam norādīta atbildīgā institūcija ar CaC ID
  dimension: completeness
slaProperties:
- property: frequency
  value: 1
  unit: d
  element: pull ingest (cron 03:30 UTC)
- property: retention
  value: visas versijas (git vēsture)
team:
- role: owner
  name: Valsts kanceleja (MK rīkojums); datu kopu sagatavo PPPA
- role: data steward
  name: PPP Asociācija (PPPA)
support:
- channel: issues
  url: https://processgit.org/Country-as-Code/Valdibas-Deklaracija-as-Code/issues
customProperties:
- property: sourceId
  value: B13
- property: namespace
  value: urn:pppa:cac:valdiba:0.2
- property: rootElement
  value: GovernmentActionPlan
- property: identifiers
  value: lv-mk-….rp; pasākums .uNNN.pN; versija .vN; izpildes ieraksts .zGGGGMMDD
