# ODCS v3 datu līgums: B01 Valsts kancelejas organizāciju reģistrs (CaC ID)
# Ģenerēts no schemas/organizaciju-registrs-0.2.xsd (tools/xsd_to_odcs.py, lakehouse). Shēmas daļu nelabot ar roku — labot XSD un ģenerēt no jauna.
apiVersion: v3.0.2
kind: DataContract
id: urn:pppa:cac:contract:B01
name: Valsts kancelejas organizāciju reģistrs (CaC ID)
version: 0.2.0
status: active
domain: Valsts kā kods (Country as Code)
dataProduct: Organizāciju reģistrs
tenant: PPP Asociācija (PPPA)
description:
  purpose: Vienots, nemainīgs identifikators (CaC ID, SS-IIII) katrai valsts pārvaldes institūcijai, ko lieto visas datu kopas (rīcības plāni,
    stratēģijas). Valsts kases kodi mainās katru gadu, CaC ID — nē.
  usage: Mašīnlasāma datu apmaiņa; ielāde datu ezerā katru dienu.
  limitations: Reģistrs izveidots no VDVC reģistra un Valsts kases 2023. gada saraksta; 12 institūcijām jāpapildina reģistrācijas numurs.
servers:
- server: processgit
  type: custom
  format: xml
  description: ProcessGit repozitorijs (Gitea API v1)
  customProperties:
  - property: url
    value: https://processgit.org/Country-as-Code/Valdibas-Deklaracija-as-Code
  - property: ref
    value: main
  - property: path
    value: data/organizacijas.xml
  - property: schema
    value: https://processgit.org/Country-as-Code/Valdibas-Deklaracija-as-Code/src/branch/main/schemas/organizaciju-registrs-0.2.xsd
schema:
- name: Sector
  logicalType: object
  physicalType: xml-element
  physicalName: Sector
  description: 'Resors (1. līmenis): ministrija vai cita centrālā valsts institūcija ar savu kodu, piemēram 03 Ministru kabinets, 20 Klimata un
    enerģētikas ministrija; rezervētie 00, 90–93. Slēgta resora kodu atkārtoti neizmanto.'
  properties:
  - name: code
    logicalType: string
    required: true
    logicalTypeOptions:
      pattern: '[0-9]{2}'
    primaryKey: true
    unique: true
  - name: validTo
    logicalType: date
    required: false
  - name: text()
    logicalType: string
    required: true
    logicalTypeOptions:
      pattern: '[\s\S]*\S[\s\S]*'
  customProperties:
  - property: lakehouseTable
    value: cac_bronze.vk_org_register
- name: Organization
  logicalType: object
  physicalType: xml-element
  physicalName: Organization
  description: ''
  properties:
  - name: id
    logicalType: string
    required: true
    logicalTypeOptions:
      pattern: '[0-9]{2}-[0-9]{4}'
    description: SS-IIII; resora kods = pirmie divi cipari; resora vadošā institūcija — SS-0000.
    primaryKey: true
    unique: true
  - name: regNo
    logicalType: string
    required: false
    logicalTypeOptions:
      pattern: '[0-9]{11}'
    description: Nodokļu maksātāja reģistrācijas numurs, 11 cipari — sasaistei ar VID un Uzņēmumu reģistru. Nav amatam un institūciju grupai.
  - name: kind
    logicalType: string
    required: true
    description: ministry = ministrija; pm-institution = Valsts kanceleja; subordinate = padotības iestāde; independent = neatkarīga vai konstitucionāla
      institūcija; office = amats (Ministru prezidents); group = institūciju grupa (visas ministrijas); municipality = pašvaldība; company = valsts
      kapitālsabiedrība; public-person = atvasināta publiska persona; association = biedrība vai sociālais partneris.
    quality:
    - type: library
      rule: validValues
      validValues:
      - ministry
      - pm-institution
      - subordinate
      - independent
      - office
      - group
      - municipality
      - company
      - public-person
      - association
  - name: parent
    logicalType: string
    required: false
    logicalTypeOptions:
      pattern: '[0-9]{2}-[0-9]{4}'
    description: Augstākā institūcija (padotības iestādei — ministrija; kapitālsabiedrībai — kapitāla daļu turētājs).
  - name: successor
    logicalType: string
    required: false
    logicalTypeOptions:
      pattern: '[0-9]{2}-[0-9]{4}'
    description: Institūcija, kas turpina darbību ar jaunu identifikatoru (pārcelta uz citu resoru, apvienota).
  - name: validFrom
    logicalType: date
    required: false
  - name: validTo
    logicalType: date
    required: false
  - name: Name
    logicalType: string
    required: true
    logicalTypeOptions:
      pattern: '[\s\S]*\S[\s\S]*'
  - name: Abbreviation
    logicalType: array
    required: false
    logicalTypeOptions:
      pattern: '[\s\S]*\S[\s\S]*'
    description: Saīsinājums vai nosaukums, kā to lieto dokumentos (AizM, VK, VIAA). Ja lietoti vairāki (SM un SAM), norāda visus; pirmais ir
      galvenais.
    items:
      logicalType: string
  - name: BudgetCode
    logicalType: array
    required: false
    description: Iestādes kods Valsts kases sarakstā (ePlāni un eTāmes) attiecīgajā gadā — sasaistei ar budžeta datiem.
    items:
      logicalType: string
  - name: BudgetCode@year
    logicalType: string
    required: false
  - name: FormerName
    logicalType: array
    required: false
    items:
      logicalType: string
  - name: FormerName@until
    logicalType: date
    required: false
  customProperties:
  - property: lakehouseTable
    value: cac_bronze.vk_org_register
  - property: lakehouseTable
    value: cac_silver.organization
quality:
- name: xsd_valid
  type: custom
  engine: xsd
  implementation: schemas/organizaciju-registrs-0.2.xsd
  description: Datne atbilst XSD shēmai; neatbilstoša datne tiek reģistrēta kā kļūda
  dimension: conformity
- name: has_reg_no
  type: custom
  engine: cac-lakehouse
  implementation: app.cac_processgit:has_reg_no
  description: Institūcijai norādīts reģistrācijas numurs (11 cipari)
  dimension: completeness
- name: parent_exists
  type: custom
  engine: cac-lakehouse
  implementation: app.cac_processgit:parent_exists
  description: Augstākā institūcija (parent) ir reģistrā
  dimension: consistency
- name: ministry_is_ss_0000
  type: custom
  engine: cac-lakehouse
  implementation: app.cac_processgit:ministry_is_ss_0000
  description: Resora vadošās institūcijas CaC ID ir SS-0000
  dimension: conformity
slaProperties:
- property: frequency
  value: 1
  unit: d
  element: pull ingest (cron 03:30 UTC)
- property: retention
  value: visas versijas (git vēsture)
team:
- role: owner
  name: Valsts kanceleja (reģistra turētājs, 03-0000)
- role: data steward
  name: PPP Asociācija (PPPA)
support:
- channel: issues
  url: https://processgit.org/Country-as-Code/Valdibas-Deklaracija-as-Code/issues
customProperties:
- property: sourceId
  value: B01
- property: namespace
  value: urn:pppa:cac:valdiba:0.2
- property: rootElement
  value: OrganizationRegistry
- property: identifiers
  value: CaC ID SS-IIII; resora vadošā institūcija SS-0000; ārējā forma urn:lv:gov:org:SS-IIII
